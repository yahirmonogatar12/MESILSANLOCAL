# Compila la app Android "Ping Monitor" (carpeta PingMonitorAndroid/) y
# publica el APK como artefacto descargable del workflow.

name: Android - Ping Monitor

on:
  push:
    paths:
      - 'PingMonitorAndroid/**'
      - '.github/workflows/ping-monitor-android.yml'
  pull_request:
    paths:
      - 'PingMonitorAndroid/**'
      - '.github/workflows/ping-monitor-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: PingMonitorAndroid

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PingMonitor-apk
          path: |
            PingMonitorAndroid/app/build/outputs/apk/debug/*.apk
            PingMonitorAndroid/app/build/outputs/apk/release/*.apk
