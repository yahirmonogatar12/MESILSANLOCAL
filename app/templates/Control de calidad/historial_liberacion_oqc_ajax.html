<div

    <div class="ae-filters-card">
        <div class="ae-card-header">
            <h3>Filtros de busqueda</h3>
        </div>
        <div class="ae-filters oqc-release-history-filters">
            <div class="ae-filter-group ae-filter-group--wide">

                <input

            </div>
            <div class="ae-filter-group">

            <div class="ae-filter-group">

            <div class="ae-filter-group">
                <label for="historial-liberacion-oqc-status">Estado</label>
                <select id="historial-liberacion-oqc-status">
                    <option value="">Todos</option>
                    <option value="released">Liberada</option>
                    <option value="received_shipping">Recibida embarques</option>
                    <option value="exception">Excepcion</option>
                    <option value="rejected">Rechazada</option>
                    <option value="cancelled">Cancelada</option>
                </select>
            </div>

                    <option value="migration">Migracion</option>
                </select>
            </div>
            <div class="ae-filter-group">

                    <option value="passed">OK</option>
                    <option value="failed">NG</option>
                    <option value="unknown">Sin dato</option>
                </select>
            </div>
            <button id="historial-liberacion-oqc-search-btn" class="ae-btn-primary" type="button">

            <button id="historial-liberacion-oqc-clear-btn" class="ae-btn-secondary" type="button">

            </button>
            <button id="historial-liberacion-oqc-export-btn" class="ae-btn-export" type="button">
                Exportar Excel
            </button>
