<!-- Historial de cambio de material por area (IMD / ASSY) - Fragmento AJAX (WF_002).
     Un solo template para las dos areas: el backend pasa `area`, `titulo` y
     `columnas`, y los IDs se prefijan con el area para no colisionar cuando
     ambas pestanas estan abiertas a la vez. La logica vive en el JS generico
     historial_tabla.js; los data-* del contenedor son su contrato.
     WF_004: ict.css + historial_tablas.css declarados en MainTemplate.html
     con cache-busting; el JS los reasegura en <head>. -->
{% set p = 'mathist-' ~ area %}
<div id="{{ p }}-container" class="hist-tbl-area-container"
     data-modulo="{{ area }}"
     data-prefijo="{{ p }}"
     data-api-base="/api/historial-material/{{ area }}"
     data-archivo="historial_material_{{ area }}"
     data-filtros="fecha-desde:fecha_desde,fecha-hasta:fecha_hasta,linea:linea,material:material,resultado:resultado,contenedor:contenedor">
<div class="ict-page">

  <!-- Tarjeta de filtros -->
  <div class="filters-card">
    <div class="card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
      </svg>
      <h3>Filtros de Búsqueda</h3>
    </div>
    <div id="{{ p }}-filters" class="hist-tbl-filters">
      <div class="filter-group">
        <label for="{{ p }}-fecha-desde">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Fecha desde
        </label>
        <input type="date" id="{{ p }}-fecha-desde">
      </div>

      <div class="filter-group">
        <label for="{{ p }}-fecha-hasta">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Fecha hasta
        </label>
        <input type="date" id="{{ p }}-fecha-hasta">
      </div>

      <div class="filter-group">
        <label for="{{ p }}-linea">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
          </svg>
          Línea
        </label>
        <select id="{{ p }}-linea">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="{{ p }}-material">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          Material
        </label>
        <input type="text" id="{{ p }}-material" placeholder="Ej. EAN66257201">
      </div>

      <div class="filter-group">
        <label for="{{ p }}-resultado">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Resultado
        </label>
        <select id="{{ p }}-resultado">
          <option value="">Todos</option>
          <option value="OK">OK</option>
          <option value="NG">NG</option>
          <option value="EQUIV">EQUIV</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="{{ p }}-contenedor">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
          </svg>
          Contenedor
        </label>
        <input type="text" id="{{ p }}-contenedor" placeholder="Buscar por código...">
      </div>

      <button id="{{ p }}-btn-consultar" class="btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        Consultar
      </button>
    </div>
  </div>

  <!-- Tarjeta de resultados -->
  <div class="results-card">
    <div class="card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
      </svg>
      <h3>{{ titulo }}</h3>
      <span class="record-count" id="{{ p }}-record-count">0 registros</span>
      <button id="{{ p }}-btn-export" class="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Exportar Excel
      </button>
    </div>
    <div class="table-wrap">
      <div class="table-loading" id="{{ p }}-table-loading">
        <div class="spinner"></div>
        <span>Cargando datos...</span>
      </div>
      <table id="{{ p }}-table" class="hist-tbl-table">
        <thead>
          <tr>
            {% for clave, etiqueta in columnas %}
            <th data-hist-filter-field="{{ clave }}">{{ etiqueta }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody id="{{ p }}-body"></tbody>
      </table>
    </div>
    <div id="{{ p }}-pagination" class="ict-pagination" style="display:none;">
      <div class="ict-pagination-info">
        <span id="{{ p }}-pagination-summary">0 - 0 de 0</span>
      </div>
      <div class="ict-pagination-controls">
        <label class="ict-pagination-perpage">
          Por pagina
          <select id="{{ p }}-per-page">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
          </select>
        </label>
        <button id="{{ p }}-page-first" type="button" class="btn-page" title="Primera">«</button>
        <button id="{{ p }}-page-prev"  type="button" class="btn-page" title="Anterior">‹</button>
        <span class="ict-pagination-current">
          <input type="number" id="{{ p }}-page-input" min="1" value="1" step="1">
          <span> / <span id="{{ p }}-page-total">1</span></span>
        </span>
        <button id="{{ p }}-page-next"  type="button" class="btn-page" title="Siguiente">›</button>
        <button id="{{ p }}-page-last"  type="button" class="btn-page" title="Ultima">»</button>
      </div>
    </div>
  </div>

</div>
</div>

<script src="{{ url_for('static', filename='js/historial_tabla.js', v='20260922f') }}"></script>
