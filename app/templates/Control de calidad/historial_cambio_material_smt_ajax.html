<!-- Historial de cambio de material de SMT - Fragmento AJAX (WF_002).
     WF_004: ict.css + historial_tablas.css declarados en
     MainTemplate.html con cache-busting; el JS los reasegura en <head>.
     ponytail: reutiliza las clases de presentacion de ict.css (filters-card,
     results-card, btn-primary, btn-export, ict-pagination) para verse identico
     al Historial de ICT sin duplicar 1300 lineas de CSS, y las .hist-tbl-* que
     comparte con los historiales de IMD y ASSY. Los IDs si llevan prefijo
     propio (smt-hist-). -->
<div id="smt-hist-container" class="smt-hist-container">
<div class="ict-page">

  <!-- Tarjeta de filtros -->
  <div class="filters-card">
    <div class="card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
      </svg>
      <h3>Filtros de Búsqueda</h3>
    </div>
    <div id="smt-hist-filters" class="hist-tbl-filters">
      <div class="filter-group">
        <label for="smt-hist-fecha-desde">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Fecha desde
        </label>
        <input type="date" id="smt-hist-fecha-desde">
      </div>

      <div class="filter-group">
        <label for="smt-hist-fecha-hasta">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Fecha hasta
        </label>
        <input type="date" id="smt-hist-fecha-hasta">
      </div>

      <div class="filter-group">
        <label for="smt-hist-linea">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
          </svg>
          Línea
        </label>
        <select id="smt-hist-linea">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="smt-hist-maquina">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          Máquina
        </label>
        <select id="smt-hist-maquina">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="smt-hist-parte">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          No Parte
        </label>
        <input type="text" id="smt-hist-parte" placeholder="Ej. EAN63488601">
      </div>

      <div class="filter-group">
        <label for="smt-hist-resultado">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Resultado
        </label>
        <select id="smt-hist-resultado">
          <option value="">Todos</option>
          <option value="OK">OK</option>
          <option value="NG">NG</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="smt-hist-barcode">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
          </svg>
          Barcode
        </label>
        <input type="text" id="smt-hist-barcode" placeholder="Buscar por código...">
      </div>

      <button id="smt-hist-btn-consultar" class="btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        Consultar
      </button>
    </div>
  </div>

  <!-- Tarjeta de resultados -->
  <div class="results-card">
    <div class="card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
      </svg>
      <h3>Cambios de Material</h3>
      <span class="record-count" id="smt-hist-record-count">0 registros</span>
      <button id="smt-hist-btn-export" class="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Exportar Excel
      </button>
    </div>
    <div class="table-wrap">
      <div class="table-loading" id="smt-hist-table-loading">
        <div class="spinner"></div>
        <span>Cargando datos...</span>
      </div>
      <table id="smt-hist-table" class="hist-tbl-table">
        <thead>
          <tr>
            <th data-smt-filter-field="fecha">Fecha</th>
            <th data-smt-filter-field="hora">Hora</th>
            <th data-smt-filter-field="linea">Línea</th>
            <th data-smt-filter-field="maquina">Máquina</th>
            <th data-smt-filter-field="slot">Slot</th>
            <th data-smt-filter-field="feeder">Feeder</th>
            <th data-smt-filter-field="resultado">Resultado</th>
            <th data-smt-filter-field="parte">Parte</th>
            <th data-smt-filter-field="cantidad">Cantidad</th>
            <th data-smt-filter-field="lote">Lote</th>
            <th data-smt-filter-field="barcode">Barcode</th>
            <th data-smt-filter-field="barcode_anterior">Barcode Anterior</th>
            <th data-smt-filter-field="seq">SEQ</th>
            <th data-smt-filter-field="vendor">Vendor</th>
            <th data-smt-filter-field="archivo">Archivo</th>
          </tr>
        </thead>
        <tbody id="smt-hist-body"></tbody>
      </table>
    </div>
    <div id="smt-hist-pagination" class="ict-pagination" style="display:none;">
      <div class="ict-pagination-info">
        <span id="smt-hist-pagination-summary">0 - 0 de 0</span>
      </div>
      <div class="ict-pagination-controls">
        <label class="ict-pagination-perpage">
          Por pagina
          <select id="smt-hist-per-page">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
          </select>
        </label>
        <button id="smt-hist-page-first" type="button" class="btn-page" title="Primera">«</button>
        <button id="smt-hist-page-prev"  type="button" class="btn-page" title="Anterior">‹</button>
        <span class="ict-pagination-current">
          <input type="number" id="smt-hist-page-input" min="1" value="1" step="1">
          <span> / <span id="smt-hist-page-total">1</span></span>
        </span>
        <button id="smt-hist-page-next"  type="button" class="btn-page" title="Siguiente">›</button>
        <button id="smt-hist-page-last"  type="button" class="btn-page" title="Ultima">»</button>
      </div>
    </div>
  </div>

</div>
</div>

<script src="{{ url_for('static', filename='js/historial_cambio_material_smt.js', v='20260922f') }}"></script>
