<!-- TEMPLATE AJAX: Control de material SMD (Material por areas) -->
<!-- PREFIJO IDs: msmd- | CONTENEDOR: material-smd-unique-container -->
<!-- Datos de Control_inventario_SMD: entradas, salidas e inventario de lotes.
     Estilo de Historial de input: ict.css + historial_produccion_ensamble.css +
     material_smd.css (persistentes en MainTemplate, WF_004). -->
<section id="msmd-root" class="hpe-module ict-page">
  <div class="filters-card">
    <div id="msmd-filters" class="hpe-filters">
      <div class="filter-group">
        <label for="msmd-vista">Consulta</label>
        <select id="msmd-vista">
          <option value="entradas">Entradas</option>
          <option value="salidas">Salidas</option>
          <option value="inventario">Inventario</option>
        </select>
      </div>
      <div class="filter-group" id="msmd-modo-group" hidden>
        <label for="msmd-modo">Modo</label>
        <select id="msmd-modo">
          <option value="general">General</option>
          <option value="detallado">Detallado</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="msmd-filter-start">Fecha desde</label>
        <input type="date" id="msmd-filter-start">
      </div>
      <div class="filter-group">
        <label for="msmd-filter-end">Fecha hasta</label>
        <input type="date" id="msmd-filter-end">
      </div>
      <button type="button" id="msmd-btn-filtrar" class="btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        Consultar
      </button>

      <div class="msmd-acciones">
        <span class="record-count" id="msmd-resumen">0 registros</span>
        <button type="button" id="msmd-btn-export" class="btn-export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          Exportar Excel
        </button>
      </div>
    </div>
  </div>

  <div class="results-card">
    <div class="table-wrap hpe-table-wrap">
      <div class="table-loading" id="msmd-table-loading" aria-live="polite">
        <div class="spinner"></div>
        <span>Cargando datos...</span>
      </div>
      <table id="msmd-table">
        <thead><tr id="msmd-thead-row"></tr></thead>
        <tbody id="msmd-tbody"></tbody>
      </table>
    </div>

    <div id="msmd-pagination" class="ict-pagination" hidden>
      <div class="ict-pagination-info">
        <span id="msmd-pagination-summary">0 - 0 de 0</span>
      </div>
      <div class="ict-pagination-controls">
        <label class="ict-pagination-perpage" for="msmd-per-page">
          Por página
          <select id="msmd-per-page">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
          </select>
        </label>
        <button id="msmd-page-first" type="button" class="btn-page" title="Primera" aria-label="Primera página">«</button>
        <button id="msmd-page-prev" type="button" class="btn-page" title="Anterior" aria-label="Página anterior">‹</button>
        <span class="ict-pagination-current">
          <input type="number" id="msmd-page-input" min="1" value="1" step="1" aria-label="Página actual">
          <span>/ <span id="msmd-page-total">1</span></span>
        </span>
        <button id="msmd-page-next" type="button" class="btn-page" title="Siguiente" aria-label="Página siguiente">›</button>
        <button id="msmd-page-last" type="button" class="btn-page" title="Última" aria-label="Última página">»</button>
      </div>
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/material_smd.js', v='20260921b') }}"></script>
